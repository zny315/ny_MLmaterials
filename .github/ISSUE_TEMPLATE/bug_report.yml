name: Bug report
description: Report a reproducible pipeline, data, or documentation problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys or copyrighted source-paper content.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include sanitized commands, inputs, and traceback.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Exact Git commit or release tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant dependency versions.
    validations:
      required: true
