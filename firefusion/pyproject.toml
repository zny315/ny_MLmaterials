[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firefusion"
version = "1.0.0"
description = "Reproducible benchmark and Bayesian transfer workflow for flame-retardant materials data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zhao Neyan"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
tabpfn = ["tabpfn==2.0.9", "torch>=2"]
parquet = ["pyarrow>=14"]
test = ["pytest>=7"]

[project.scripts]
firefusion = "firefusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
